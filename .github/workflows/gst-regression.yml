name: GST Agent Regression Gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.experiment --out results --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gst-agenticops-evidence
          path: results/
